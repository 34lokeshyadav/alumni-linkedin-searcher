#last one//////////////////////////



spring.application.name=alumni-linkedin-searcher

server.port=${PORT:8080}
server.address=0.0.0.0

# PostgreSQL - require cloud database credentials
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# PhantomBuster
phantombuster.base-url=${PHANTOMBUSTER_BASE_URL:https://api.phantombuster.com/api/v2}
phantombuster.api-key=${PHANTOMBUSTER_API_KEY:}
phantombuster.agent-id=${PHANTOMBUSTER_AGENT_ID:}
phantombuster.max-wait-seconds=${PHANTOMBUSTER_MAX_WAIT_SECONDS:180}
phantombuster.mock-mode=${PHANTOMBUSTER_MOCK_MODE:false}

# Google Custom Search
google.search.api-key=${GOOGLE_SEARCH_API_KEY:}
google.search.cx=${GOOGLE_SEARCH_CX:}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs








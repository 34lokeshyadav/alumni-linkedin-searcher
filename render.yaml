services:
  - type: web
    name: alumni-linkedin-searcher
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /v3/api-docs
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        fromDatabase:
          name: alumni-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: alumni-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: alumni-db
          property: password
      - key: PHANTOMBUSTER_API_KEY
        sync: false
      - key: PHANTOMBUSTER_AGENT_ID
        sync: false
      - key: PHANTOMBUSTER_MOCK_MODE
        value: "false"

databases:
  - name: alumni-db
    plan: free
    region: oregon
    databaseName: alumni_db
    user: postgres

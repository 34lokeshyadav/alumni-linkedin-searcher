services:
  - type: web
    name: alumni-linkedin-searcher
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v3/api-docs
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: PHANTOMBUSTER_API_KEY
        sync: false
      - key: PHANTOMBUSTER_AGENT_ID
        sync: false
      - key: PHANTOMBUSTER_MOCK_MODE
        value: "false"